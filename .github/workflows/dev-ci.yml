name: dev-ci
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-24.04
    name: quick-debug-cdrstream
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DENABLE_SSL=ON -DSANITIZER=undefined
      - run: cmake --build build -j $(nproc)
      - run: ctest --test-dir build -j 4 --output-on-failure --timeout 300 -R 'cdrstream|serdata|psmx|trailing_octets'

